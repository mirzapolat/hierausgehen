name: Deploy to VPS

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  APP_NAME: "hierausgehen"

jobs:
  # Vor dem Ausliefern dieselbe Prüfung wie lokal (siehe CLAUDE.md). Ohne sie
  # landet ein kaputter Parser unbemerkt auf hierausgehen.de.
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Node einrichten
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Parser gegen die gespeicherten Antworten
        run: npm test

      # `next typegen` legt die generierten Typen (PageProps, LayoutProps) an,
      # die sonst nur nach einem Build im Arbeitsverzeichnis liegen.
      - name: Typen
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Build
        run: npm run build

  deploy:
    needs: test
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v5

      - name: Configure SSH
        run: |
          mkdir -p ~/.ssh/
          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H -p ${{ secrets.SSH_PORT }} ${{ secrets.SSH_HOST }} >> ~/.ssh/known_hosts

      - name: Sync Files to VPS (Rsync)
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} \
            "mkdir -p ~/docker/apps/${{ env.APP_NAME }}"
          rsync -avz --delete-after \
            --filter=":e- .gitignore" \
            --filter="- .git/" \
            --filter="- .github/" \
            --filter="- .env" \
            --filter="- .env.*" \
            --filter="- instance/" \
            --filter="- data/" \
            --filter="- .mirror/" \
            --filter="- .cache/" \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }}" \
            ./ ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}:~/docker/apps/${{ env.APP_NAME }}/

      - name: Build & Restart Containers
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ secrets.SSH_PORT }} \
            ${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }} " \
            cd ~/docker/apps/${{ env.APP_NAME }} && \
            DOCKER_BUILDKIT=1 docker compose up -d --build --remove-orphans && \
            docker image prune -f "
